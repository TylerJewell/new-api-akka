akka.javasdk.dev-mode.http-port = 9057

new-api {
  # The upstream this gateway dispatches to. In tests this name is mocked; in dev
  # mode it resolves through the SDK's normal service lookup.
  upstream-service = "upstream"

  dispatch {
    # SPEC-001 §4.1: the source ships RetryTimes=0 (one attempt, no failover) by
    # default. This port raises the default so failover is observable without
    # first reconfiguring it -- a documented divergence, not an oversight.
    max-retries = 2
  }

  pricing {
    model-ratio = 1.0
    completion-ratio = 1.0
    group-ratio = 1.0
    # SPEC-001 §3.13: floor applied to promptTokens before pre-consuming, so a
    # short prompt still reserves a safety margin against an unknown completion
    # length. Matches the source's common.PreConsumedQuota default of 500.
    min-pre-consume-tokens = 500
  }

  # SPEC-001 §3.8 default retry table -- ranges given as "start-end", matching
  # setting/operation_setting/status_code_ranges.go's AutomaticRetryStatusCodeRanges
  # exactly: retry on 1xx, 3xx, 4xx except 400/408, 5xx except 504/524.
  retry-on-status-ranges = ["100-199", "300-399", "401-407", "409-499", "500-503", "505-523", "525-599"]

  auto-disable {
    # SPEC-001 §3.10: off by default, matching common.AutomaticDisableChannelEnabled.
    enabled = false
    # SPEC-001 §3.11 default disable-status set: {401} only.
    disable-on-status = [401]
  }
}
